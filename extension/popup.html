<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 290px; font: 13px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 12px; color: #1f2328; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  input { width: 100%; padding: 6px; border: 1px solid #c9ced4; border-radius: 5px; font-size: 12px; box-sizing: border-box; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  button { padding: 5px 10px; border: 1px solid #c9ced4; background: #fff; border-radius: 5px; cursor: pointer; }
  #status { margin-top: 10px; font-size: 12px; color: #6a737d; min-height: 16px; }
  p { color: #6a737d; font-size: 11px; }
</style>
</head>
<body>
  <label for="api">API address</label>
  <input id="api" placeholder="https://you--parakh-api-api.modal.run">
  <div class="row"><button id="save">Save</button><button id="check">Check</button><button id="local">Use localhost</button></div>
  <div id="status"></div>
  <p>Open a phone on flipkart.com and click the Parakh tab on the right edge.</p>
  <script src="popup.js"></script>
</body>
</html>
